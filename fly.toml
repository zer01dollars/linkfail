# fly.toml app configuration file generated for linkfail on 2026-09-13T06:24:44Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'linkfail'
primary_region = 'iad'

[build]
  dockerfile = 'service/Dockerfile'

[env]
  POLAR_ORGANIZATION_ID = 'b6303f05-be1c-4b45-b847-5979667a3d12'
  PORT = '8787'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
