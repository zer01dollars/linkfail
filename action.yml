name: 'Linkfail'
description: 'Full-service docs link CI: fail PRs, PR comments, HTML/SARIF reports, weekly Issues, webhooks. Made By Zer01.'
author: 'Zer01'
branding:
  icon: 'link'
  color: 'red'

inputs:
  github-token:
    description: 'GitHub token (Issues + PR comments). Defaults to GITHUB_TOKEN.'
    required: false
    default: ${{ github.token }}
  polar-license-key:
    description: 'Polar license key (LINKFAIL / LINKFAIL-1X / LINKFAIL-LT)'
    required: false
  polar-organization-id:
    description: 'Polar organization id (defaults to Zer01 / driftwatch-kit org)'
    required: false
  skip-license:
    description: 'Skip license check (try-before-buy / this repo CI)'
    required: false
    default: 'false'
  mode:
    description: 'auto (recommended) | pr | schedule. auto fails on PR/push and opens an Issue on schedule.'
    required: false
    default: 'auto'
  config-path:
    description: 'Optional linkfail.yml path. Omit the file to use built-in defaults.'
    required: false
    default: 'linkfail.yml'
  fail-on-broken:
    description: 'Override fail behavior. Leave empty with mode=auto.'
    required: false
    default: ''
  open-issue:
    description: 'Override Issue digest. Leave empty with mode=auto.'
    required: false
    default: ''
  comment-on-pr:
    description: 'Upsert a PR comment with the report. Default true on pull_request events.'
    required: false
    default: ''
  issue-title:
    description: 'Title for the digest Issue'
    required: false
    default: 'Linkfail: broken links detected'
  write-sarif:
    description: 'Write linkfail-out/linkfail.sarif for Code Scanning'
    required: false
    default: 'true'
  webhook-url:
    description: 'Slack-compatible incoming webhook URL (or set LINKFAIL_WEBHOOK_URL)'
    required: false
  output-dir:
    description: 'Directory for report.md / report.html / SARIF'
    required: false
    default: 'linkfail-out'

outputs:
  broken-count:
    description: 'Broken / timeout / error URL count'
  ok-count:
    description: 'Healthy URL count'
  url-count:
    description: 'Unique URLs checked'
  issue-url:
    description: 'Issue URL when a digest was written'
  comment-url:
    description: 'PR comment URL when upserted'
  report-dir:
    description: 'Output directory for reports'

runs:
  using: 'node20'
  main: 'dist/index.js'
