name: 'Linkfail'
description: 'Fail CI when Markdown docs links die. Optional weekly Issue digest. Made By Zer01.'
author: 'Zer01'
branding:
  icon: 'link'
  color: 'red'

inputs:
  github-token:
    description: 'GitHub token (Issues API). Defaults to GITHUB_TOKEN.'
    required: false
    default: ${{ github.token }}
  polar-license-key:
    description: 'Polar license key (LINKFAIL / LINKFAIL-1X / LINKFAIL-LT)'
    required: false
  skip-license:
    description: 'Skip license check (try-before-buy / this repo CI)'
    required: false
    default: 'false'
  mode:
    description: 'auto (recommended) | pr | schedule. auto fails on PR/push and opens an Issue on schedule.'
    required: false
    default: 'auto'
  config-path:
    description: 'Optional linkfail.yml path. Omit the file to use built-in defaults.'
    required: false
    default: 'linkfail.yml'
  fail-on-broken:
    description: 'Override fail behavior. Leave empty with mode=auto.'
    required: false
    default: ''
  open-issue:
    description: 'Override Issue digest. Leave empty with mode=auto.'
    required: false
    default: ''
  issue-title:
    description: 'Title for the digest Issue'
    required: false
    default: 'Linkfail: broken links detected'

outputs:
  broken-count:
    description: 'Broken / timeout / error URL count'
  ok-count:
    description: 'Healthy URL count'
  url-count:
    description: 'Unique URLs checked'
  issue-url:
    description: 'Issue URL when a digest was written'

runs:
  using: 'node20'
  main: 'dist/index.js'
