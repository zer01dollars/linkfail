# Optional. Delete this file to use built-in defaults (scan **/*.md,
# ignore localhost + shields.io badges).
#
# cp templates/linkfail.example.yml linkfail.yml

include:
  - "**/*.md"

exclude:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/CHANGELOG.md"

# Extra ignores (built-ins already skip localhost + shields)
ignoreUrls:
  - "https://twitter.com/"

timeoutMs: 10000
concurrency: 8
checkHtml: false
